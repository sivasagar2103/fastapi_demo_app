
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-management-demo"
version = "1.0.0"
description = "Multi-tenant management API architecture demonstration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.30,<1", 
    "PyJWT>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "bcrypt>=5,<6",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiomysql>=0.2,<1",
    "cryptography>=44",
    "httpx>=0.27,<1",
    "aio-pika>=9.4,<10"
    ]

[project.optional-dependencies]
ui = ["streamlit>=1.50,<2", "httpx>=0.27,<1"]
dev = ["aiosqlite>=0.20,<1", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["rest_api_server", "rest_api_server.routers", "rest_api_server.services", "rest_api_server.repositories", "rest_api_server.models"]
package-dir = {rest_api_server = "."}
